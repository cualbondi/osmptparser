[package]
name = "osmptparser"
description = "Openstreetmap Public Transport Parser"
version = "4.1.0"
authors = ["Julian Perelli <jperelli@gmail.com>"]
edition = "2018"
license = "AGPL-3.0-or-later"
readme = "README.md"

[lib]
name = "osmptparser"
crate-type = ["rlib", "cdylib"]
# the built-in libtest harness does not understand criterion flags like
# `--save-baseline`; disable it so `cargo bench` only runs the criterion bench
bench = false

[dependencies]
# osm_pbf_iter = { path = "../rust-osm-pbf-iter" }
# osm_pbf_iter = { git = "https://github.com/astro/rust-osm-pbf-iter", rev="a7849efd7ac33768f0e982879ca1c6acc3ff82a6" }
osm_pbf_iter = "0.2.3"
crossbeam = "0.8.5"
num_cpus = "1.17.0"
rustc-hash = "2.1.3"
structopt = "0.3.26"
serde_json = "1.0.151"

[dev-dependencies]
criterion = "0.8.2"
pprof = { version = "0.15", features = ["flamegraph"] }

[[example]]
name = "main"
path = "src/example.rs"

[[bin]]
name = "osmptparser"
path = "src/bin.rs"
bench = false

[[bench]]
name = "e2e"
harness = false
